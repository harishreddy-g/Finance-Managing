<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Management - Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            margin: 0;
            padding: 30px;
            min-height: 100vh;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .nav {
            max-width: 1000px;
            margin: 0 auto 30px auto;
            padding: 15px 25px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav a {
            text-decoration: none;
            color: #f8fafc;
            font-weight: 500;
            margin-right: 25px;
            transition: color 0.2s;
        }

        .nav a:hover { color: #a855f7; }

        .logout-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: translateY(-1px);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 35px;
            border-radius: 16px;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 40px;
            background: -webkit-linear-gradient(#f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 { font-weight: 600; margin-top: 0; color: #f1f5f9; }

        .alert {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            padding: 15px 20px;
            margin-bottom: 25px;
            border-radius: 10px;
            display: none;
            font-weight: 500;
            text-align: center;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        /* Used grid for top layout */
        .dashboard-top {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 25px;
            margin-bottom: 25px;
        }

        .stats-form-group {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .stats {
            display: flex;
            gap: 20px;
        }

        .stat-box {
            flex: 1;
            padding: 25px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-box strong { font-size: 14px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;}
        .stat-box span { font-size: 32px; font-weight: 700; color: #f8fafc; }

        .chart-container {
            padding: 25px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .filter-form, .transaction-form {
            padding: 25px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .filter-form { display: flex; gap: 15px; }

        input, select {
            width: 100%;
            padding: 12px 16px;
            margin: 5px 0 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            box-sizing: border-box;
            background: rgba(15, 23, 42, 0.6);
            color: white;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
        }
        input::placeholder { color: #64748b; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); cursor: pointer; }

        .filter-form input { margin: 0; flex: 1; }

        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            white-space: nowrap;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px rgba(168, 85, 247, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); box-shadow: none; }

        .delete-btn {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 8px 16px;
            margin: 0;
        }
        .delete-btn:hover { background: rgba(239, 68, 68, 0.4); box-shadow: none; }

        .transaction-list { margin-top: 5px; }

        .transaction-item {
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            margin: 10px 0;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            transition: background 0.2s;
        }

        .transaction-item:hover { background: rgba(255, 255, 255, 0.05); }

        .t-info { display: flex; flex-direction: column; gap: 4px; }
        .t-category { font-weight: 600; font-size: 16px; color: #f8fafc;}
        .t-amount { color: #d8b4fe; font-weight: 700; font-size: 18px; }
        .t-date { color: #94a3b8; font-size: 13px; }
    </style>
</head>
<body>

    <div class="nav glass-panel">
        <div>
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="container glass-panel">
        <h1>Finance Management</h1>

        <div id="budgetAlert" class="alert">⚠️ Warning: Your total expenses have exceeded your budget limit!</div>

        <div class="dashboard-top">
            <div class="stats-form-group">
                <div class="stats">
                    <div class="stat-box"><strong>Total Spent</strong> <span>$<span id="totalSpent">0</span></span></div>
                    <div class="stat-box"><strong>Budget Limit</strong> <span>$<span id="budgetLimit">0</span></span></div>
                </div>

                <div class="transaction-form">
                    <h2>Add Transaction</h2>
                    <input type="text" id="category" placeholder="Category (e.g. Food, Rent)" required>
                    <input type="number" id="amount" placeholder="Amount ($)" required>
                    <input type="date" id="date" required>
                    <button style="width: 100%; margin-top: 10px;" onclick="addTransaction()">Add Transaction</button>
                </div>
            </div>

            <div class="chart-container">
                <div style="width: 100%; height: 100%; min-height: 250px; display: flex; align-items:center; justify-content: center;">
                    <canvas id="transactionsChart"></canvas>
                </div>
            </div>
        </div>

        <div class="filter-form">
            <input type="text" id="filterCategory" placeholder="Filter by exact category (e.g. Food)">
            <button onclick="applyFilter()">Filter</button>
            <button onclick="clearFilter()" class="btn-secondary">Clear</button>
        </div>

        <div class="transaction-list">
            <h2 style="margin-left: 5px;">Recent Transactions</h2>
            <div id="transactions"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:3000';
        const token = localStorage.getItem('token');
        let myChart = null;
        let userBudgetLimit = 0;
        let currentCategoryFilter = '';

        if (!token) {
            window.location.href = 'login.html';
        }

        Chart.defaults.color = '#94a3b8'; // Updates chart text color to match theme

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }

        async function initDashboard() {
            await fetchUserProfile();
            await loadTransactions();
        }

        async function fetchUserProfile() {
            try {
                const response = await fetch(`${API_BASE}/auth/profile`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.success) {
                    userBudgetLimit = data.user.budgetLimit || 0;
                    document.getElementById('budgetLimit').textContent = userBudgetLimit;
                }
            } catch (error) {
                console.error('Failed to load profile details');
            }
        }

        function applyFilter() {
            currentCategoryFilter = document.getElementById('filterCategory').value;
            loadTransactions();
        }

        function clearFilter() {
            document.getElementById('filterCategory').value = '';
            currentCategoryFilter = '';
            loadTransactions();
        }

        async function addTransaction() {
            const category = document.getElementById('category').value;
            const amount = document.getElementById('amount').value;
            const date = document.getElementById('date').value;

            try {
                const response = await fetch(`${API_BASE}/transactions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ category, amount, date })
                });
                const data = await response.json();
                if (data.success) {
                    loadTransactions(); // refresh
                    document.getElementById('category').value = '';
                    document.getElementById('amount').value = '';
                    document.getElementById('date').value = '';
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert('Failed to add transaction');
            }
        }

        async function loadTransactions() {
            let url = `${API_BASE}/transactions`;
            if (currentCategoryFilter) {
                url += `?category=${encodeURIComponent(currentCategoryFilter)}`;
            }

            try {
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.success) {
                    processDashboardData(data.data);
                    displayTransactions(data.data);
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert('Failed to load transactions');
            }
        }

        function processDashboardData(transactions) {
            let totalAmount = 0;
            const categoryTotals = {};

            transactions.forEach(t => {
                totalAmount += t.amount;
                categoryTotals[t.category] = (categoryTotals[t.category] || 0) + t.amount;
            });

            document.getElementById('totalSpent').textContent = totalAmount;

            // Budget alert logic
            const alertBox = document.getElementById('budgetAlert');
            if (userBudgetLimit > 0 && totalAmount > userBudgetLimit) {
                alertBox.style.display = 'block';
            } else {
                alertBox.style.display = 'none';
            }

            updateChart(categoryTotals);
        }

        function updateChart(categoryTotals) {
            const labels = Object.keys(categoryTotals);
            const data = Object.values(categoryTotals);
            const ctx = document.getElementById('transactionsChart').getContext('2d');

            if (myChart) {
                myChart.destroy();
            }

            if (labels.length === 0) {
                return;
            }

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: [
                            '#818cf8', '#34d399', '#fb7185', 
                            '#fbbf24', '#2bd4bd', '#a78bfa',
                            '#f472b6', '#fb923c', '#2dd4bf'
                        ],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#e2e8f0',
                                padding: 20
                            }
                        }
                    },
                    layout: {
                        padding: 10
                    }
                }
            });
        }

        function displayTransactions(transactions) {
            const container = document.getElementById('transactions');
            container.innerHTML = '';
            
            if (transactions.length === 0) {
                container.innerHTML = '<p style="color: #94a3b8; text-align: center; padding: 20px;">No transactions found.</p>';
                return;
            }

            transactions.forEach(transaction => {
                const item = document.createElement('div');
                item.className = 'transaction-item';
                item.innerHTML = `
                    <div class="t-info">
                        <div class="t-category">${transaction.category} <span class="t-amount">$${transaction.amount}</span></div>
                        <div class="t-date">${new Date(transaction.date).toLocaleDateString(undefined, {year: 'numeric', month: 'short', day: 'numeric'})}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteTransaction('${transaction._id}')">Delete</button>
                `;
                container.appendChild(item);
            });
        }

        async function deleteTransaction(id) {
            if(!confirm("Are you sure you want to delete this transaction?")) return;

            try {
                const response = await fetch(`${API_BASE}/transactions/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();
                if (data.success) {
                    loadTransactions(); // refresh
                } else {
                    alert(data.message);
                }
            } catch (error) {
                alert('Failed to delete transaction');
            }
        }

        // Boot up
        initDashboard();
    </script>
</body>
</html>
